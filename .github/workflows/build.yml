name: Build APKs

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Camera test tool (native; packed into the probe APK so adb shell can run it)
        run: |
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          mkdir -p probe/src/main/jniLibs/arm64-v8a
          "$CC" -O2 -Wall -fPIE -pie -o probe/src/main/jniLibs/arm64-v8a/libshark6camtest.so tools/camtest/camtest.c -ldl
          file probe/src/main/jniLibs/arm64-v8a/libshark6camtest.so
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          "$CC" -O2 -Wall -fPIE -pie -o launcher/src/main/jniLibs/arm64-v8a/libshark6cam.so tools/camhelper/camhelper.c -ldl -lpthread
      - name: Build
        run: gradle --no-daemon :probe:assembleDebug :launcher:assembleDebug
      - name: Rename APK
        run: |
          cp probe/build/outputs/apk/debug/probe-debug.apk shark6-probe.apk
          cp launcher/build/outputs/apk/debug/launcher-debug.apk shark6-home.apk
      - name: Version file (read by the launcher's update check)
        run: |
          code=$(grep -oP 'versionCode \K\d+' launcher/build.gradle)
          name=$(grep -oP "versionName '\K[^']+" launcher/build.gradle)
          echo "{\"code\":$code,\"name\":\"$name\"}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: shark6-apks
          path: |
            shark6-probe.apk
            shark6-home.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shark 6 (build ${{ github.run_number }})
          body: Home screen (shark6-home.apk) and read-only probe (shark6-probe.apk). See README for install steps.
          files: |
            shark6-probe.apk
            shark6-home.apk
            version.json
      # Held work on the next branch: a pre-release, which the launcher's update check ignores.
      - name: Publish test build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/next'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-${{ github.run_number }}
          name: Shark 6 test build ${{ github.run_number }} (not offered as an update)
          prerelease: true
          body: Test build from the next branch. Install by hand with adb; the launcher's update check skips pre-releases.
          files: |
            shark6-probe.apk
            shark6-home.apk
            version.json
