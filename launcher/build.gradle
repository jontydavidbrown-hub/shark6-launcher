plugins { id 'com.android.application' }

android {
    namespace 'au.jonty.shark6.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'au.jonty.shark6.launcher'
        // Shark 6 runs Android 11 (API 30); targeting 29 keeps package visibility open.
        minSdk 29
        targetSdk 29
        versionCode 28
        versionName '0.28'
        ndk { abiFilters 'arm64-v8a' }
    }
    // Fixed debug key, committed on purpose, so every CI build can update the installed app.
    signingConfigs {
        debug {
            storeFile rootProject.file('keys/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
    // The camera helper (libshark6cam.so, built by CI from tools/camhelper) must sit unpacked in the
    // app's lib folder: the only place on the car that adb's shell may run programs from.
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    // Talks to the car's own ADB to start the camera helper as the shell user (Apache-2.0).
    implementation('dev.mobile:dadb:1.2.8') {
        // dadb 1.2.8 wrongly ships its test runner as a runtime dependency.
        exclude group: 'org.junit.platform'
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.graalvm.buildtools'
    }
}
