@keyframes s6stat{from{transform:translateY(18px);opacity:0;letter-spacing:.3em}to{transform:none;opacity:1}}
/* HOME: tiles glide in from the sides, dials zoom up out of a blur */
html[data-page="home"] #stage section[aria-label="Now playing"],html[data-page="home"] #stage section[aria-label="Media"]{animation:s6inL .55s cubic-bezier(.2,.8,.2,1) both}
html[data-page="home"] #stage section[aria-label="Drive"]{animation:s6zoom .7s cubic-bezier(.2,.8,.2,1) both}
html[data-page="home"] #stage section[aria-label="Cameras"]{animation:s6fade .6s .15s ease-out both}
/* VEHICLE: wireframe scans in (wire3d.js); stats rise in, staggered */
#stage section[aria-label="Vehicle"]>div>div{animation:s6stat .6s cubic-bezier(.2,.8,.2,1) both}
#stage section[aria-label="Vehicle"]>div>div:nth-child(2){animation-delay:.12s}
#stage section[aria-label="Vehicle"]>div>div:nth-child(3){animation-delay:.24s}
#stage section[aria-label="Vehicle"]>div>div:nth-child(4){animation-delay:.36s}
#stage section[aria-label="Vehicle"]>div>div:nth-child(5){animation-delay:.48s}
/* OFF-ROAD: the panels swing down like a horizon levelling out */
html[data-page="offroad"] #stage section[aria-label="Drive"]{animation:none}
#stage div[aria-label="Off-road view"]>div{animation:s6tilt .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
#stage div[aria-label="Off-road view"]>div:nth-child(2){animation-delay:.08s}
#stage div[aria-label="Off-road view"]>div:nth-child(3){animation:s6horizon .9s .14s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 50%}
/* CAMERAS: a lock-on frame and a scan line sweep the view */
html[data-page="cameras"] #stage section[aria-label="Cameras"]{position:relative;animation:s6fade .4s ease-out both}
html[data-page="cameras"] #stage section[aria-label="Cameras"]::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border:2px solid var(--acc-glow,#D42A3A);border-radius:20px;pointer-events:none;z-index:30;animation:s6frame .8s ease-out both}
html[data-page="cameras"] #stage section[aria-label="Cameras"]::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px 4px var(--acc-glow,#D42A3A);pointer-events:none;z-index:30;animation:s6scan .9s .1s ease-in-out both}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
// The design is 1600x900 (full screen: the app hides BYD's header and bottom bar). Scale it to fit the window.
(function () {
  var fit = document.getElementById('fit');
  function size() {
    // Fill the height; the layout stretches sideways to the screen's full width.
    var w = window.innerWidth, h = window.innerHeight;
    if (h > w) {
      // Portrait: 900 wide, stretched to the screen's full height.
      var kp = w / 900;
      fit.className = 'portrait';
      fit.style.width = '900px';
      fit.style.height = Math.max(1600, h / kp) + 'px';
      fit.style.transform = 'scale(' + kp + ')';
      return;
    }
    fit.className = '';
    fit.style.height = '900px';
    var k = h / 900, lw = w / k;
    if (lw < 1600) { k = w / 1600; lw = 1600; }
    fit.style.width = lw + 'px';
    fit.style.transform = 'translate(0px,' + Math.round((h - 900 * k) / 2) + 'px) scale(' + k + ')';
  }
  window.addEventListener('resize', size);
  // Old WebView scrolls a focused control into view, which shoved the tiles up. Pin the page.
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });
  document.addEventListener('focusin', function (e) { if (e.target && e.target.type !== 'range' && e.target.blur) e.target.blur(); window.scrollTo(0, 0); });
  size();
})();
</script>
<script src="htm-preact.umd.js"></script>
<script src="wire-model.js"></script>
<script src="wire3d.js"></script>
<script src="app.js"></script>
</body>
</html>
