<head>

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shark 6</title>
<style>

@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:600;src:url(fonts/barlow-condensed-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}

html,body{margin:0;height:100%;position:fixed;width:100%;top:0;left:0;background:#050505;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#fit{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
#stage{width:100%;height:100%}
a{color:#D42A3A}
/* ---- 0.54 look (Jonty approved the unified mock-up 2026-11-20): one glass material on one lit background ---- */
:root{--acc-glow:rgba(212,42,58,0.65);--acc-wash:rgba(212,42,58,0.10)}
#stage>div{background:radial-gradient(1300px 760px at 50% 48%, var(--acc-wash), transparent 72%), #08080A!important}
/* Every tile: the same faint glass with a top hairline */
#stage section[aria-label="Now playing"], #stage div[aria-label="Tyre pressures"], #stage div[aria-label^="Trip"], #stage div[aria-label^="Camera"], #stage section[aria-label="Climate and seats"]{background:rgba(255,255,255,0.03)!important;border:0!important;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07), inset 0 0 0 1px rgba(255,255,255,0.04)!important;border-radius:20px!important}
/* Controls inside a tile: one step brighter of the same glass */
#stage section[aria-label="Climate and seats"] button, #stage button[aria-label$="track"]{background:rgba(255,255,255,0.045)!important;box-shadow:none!important;border-radius:14px!important}
#stage section[aria-label="Climate and seats"] button:not([aria-pressed="true"]), #stage button[aria-label$="track"]{border-color:transparent!important}
#stage section[aria-label="Climate and seats"] button[aria-pressed="true"]{background:rgba(255,255,255,0.08)!important;border-width:1px!important}
#stage section[aria-label="Climate and seats"] div[style*="210px"]{background:rgba(255,255,255,0.045)!important;border-radius:14px!important}
#stage section[aria-label="Climate and seats"] button[aria-label$="temperature down"], #stage section[aria-label="Climate and seats"] button[aria-label$="temperature up"], #stage section[aria-label="Climate and seats"] button[aria-label*="degrees, tap for slider"]{background:transparent!important}
#stage section[aria-label="Climate and seats"] button>span{display:none!important}
#stage section[aria-label="Climate and seats"] button svg{-webkit-transform:scale(1.15);transform:scale(1.15)}
#stage button[aria-label="Pause"], #stage button[aria-label="Play"]{border-radius:14px!important;-webkit-transform:none!important;transform:none!important}
#stage section[aria-label="Now playing"] div[style*="width: 116px"]>div{background-color:rgba(255,255,255,0.04)!important;border-radius:14px!important}
#stage #s6-cam{border-radius:14px!important}
/* Header: clock and outside temperature only */
#stage div[aria-label="Status"]>div:first-child{visibility:hidden}
#stage div[aria-label="Status"]>div:nth-child(3)>span:nth-child(1),#stage div[aria-label="Status"]>div:nth-child(3)>span:nth-child(2),#stage div[aria-label="Status"]>div:nth-child(3)>span:nth-child(5),#stage div[aria-label="Status"]>div:nth-child(3)>span:nth-child(6){display:none!important}
#stage div[aria-label="Status"]>div:nth-child(3)>span:nth-child(3){margin-left:0!important}
#stage div[aria-label="Status"] button{background:transparent!important;border:0!important;opacity:.55}
#stage div[aria-label="Time"] span:first-child{font-size:40px!important;font-weight:500!important}
/* No section titles: numbers and units say what they are */
#stage span[style*="font-style: italic"][style*="letter-spacing: 0.12em"]{display:none!important}
#stage div[aria-label^="Trip"]>div:first-child{position:absolute;top:12px;right:16px}
#stage div[aria-label^="Trip"]{-webkit-box-pack:center!important;justify-content:center!important}
/* Dials: round caps, deep tracks, glowing live arcs */
#stage section[aria-label="Range"] circle, #stage section[aria-label="Speed"] circle{stroke-linecap:round}
#stage circle[stroke="#262626"], #stage circle[stroke="#1C1C1C"]{stroke:#17171A!important}
#stage circle.s6-acc{-webkit-filter:drop-shadow(0 0 10px var(--acc-glow));filter:drop-shadow(0 0 10px var(--acc-glow))}
#stage circle[stroke="#F2F2F2"]{stroke:#E9E9EE!important;-webkit-filter:drop-shadow(0 0 6px rgba(255,255,255,0.35));filter:drop-shadow(0 0 6px rgba(255,255,255,0.35))}
#stage circle[stroke="#2A2A2A"], #stage circle[stroke="#050505"]{display:none}
#stage span[style*="font-size: 104px"]{font-size:112px!important;text-shadow:0 0 30px rgba(255,255,255,0.12)}
#stage section[aria-label="Range"] [style*="border-left: 4px"]{border-left-width:2px!important}
#stage section[aria-label="Range"] [style*="font-size: 36px"]{font-size:30px!important}
#stage section[aria-label="Range"] [style*="font-size: 20px"]{font-size:16px!important;letter-spacing:.12em!important;color:#7C7C84!important}
#stage section[aria-label="Speed"] [style*="height: 12px"], #stage section[aria-label="Range"] [style*="height: 12px"]{height:8px!important;border-radius:4px!important;background:#17171A!important;overflow:visible}
#stage section[aria-label="Speed"] [style*="height: 12px"]>div:first-child, #stage section[aria-label="Range"] [style*="height: 12px"]>div:first-child{border-radius:4px;box-shadow:0 0 12px currentColor}
#stage section[aria-label="Speed"] div[style*="justify-content: space-between"]>span:first-child, #stage section[aria-label="Speed"] div[style*="justify-content: space-between"]>span:last-child{visibility:hidden}
/* Climate: no dock behind the buttons, they sit straight on the background like the dials (Jonty 2026-11-20) */
#stage section[aria-label="Climate and seats"]{background:transparent!important;box-shadow:none!important}
#stage section[aria-label="Climate and seats"] button, #stage section[aria-label="Climate and seats"] div[style*="210px"]{background:rgba(255,255,255,0.05)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06)!important}
#stage section[aria-label="Climate and seats"] button[aria-pressed="true"]{background:rgba(255,255,255,0.08)!important}
#stage section[aria-label="Climate and seats"] button[aria-label$="temperature down"], #stage section[aria-label="Climate and seats"] button[aria-label$="temperature up"], #stage section[aria-label="Climate and seats"] button[aria-label*="degrees, tap for slider"]{background:transparent!important;box-shadow:none!important}
/* No trip tile (Jonty 2026-11-20): sit the dials lower so they centre in the freed space */
#fit:not(.portrait) #stage section[aria-label="Drive"]{padding-top:64px;box-sizing:border-box}
/* Portrait (screen rotated): 900 wide, as tall as the screen. Same tiles, rearranged (Jonty approved the mock-up 2026-11-19). */
#fit.portrait #stage>div{width:900px!important;height:100%!important;grid-template-columns:340px minmax(0,1fr)!important;grid-template-rows:44px 530px minmax(0,1fr) 236px!important}
#fit.portrait #stage>div>section[aria-label="Drive"]{grid-column:1 / -1!important;grid-row:2!important}
#fit.portrait #stage>div>section[aria-label="Media and shortcuts"]{grid-column:1!important;grid-row:3!important}
#fit.portrait #stage>div>section[aria-label="Cameras"]{grid-column:2!important;grid-row:3!important}
#fit.portrait #stage>div>section[aria-label="Climate and seats"]{grid-column:1 / -1!important;grid-row:4!important;flex-wrap:wrap!important;justify-content:center!important;align-content:center!important;row-gap:14px!important;column-gap:14px!important;padding:0 16px!important}
#fit.portrait section[aria-label="Climate and seats"]>div:nth-child(3){order:-1;flex-basis:100%;justify-content:center}
#fit.portrait section[aria-label="Climate and seats"]>div:not(:nth-child(3)){zoom:0.86}
#fit.portrait #stage>div>div[aria-label="Status"]{grid-template-columns:auto minmax(0,1fr)!important}
#fit.portrait #stage>div>div[aria-label="Status"]>div:first-child{display:none!important}
#fit.portrait #stage>div>div[aria-label="Status"]>div:nth-child(2){justify-self:start!important}
#fit.portrait [style*="width: 1600px"]{width:100%!important;height:100%!important}
#fit.portrait [style*="width: 1500px"]{width:860px!important;max-height:94%!important}
/* Flex gaps as margins: the car's WebView predates flexbox gap. */
.gx-10>*+*{margin-left:10px}.gx-14>*+*{margin-left:14px}.gx-16>*+*{margin-left:16px}.gx-18>*+*{margin-left:18px}.gx-20>*+*{margin-left:20px}.gx-22>*+*{margin-left:22px}.gx-24>*+*{margin-left:24px}.gx-28>*+*{margin-left:28px}.gx-4>*+*{margin-left:4px}.gx-6>*+*{margin-left:6px}.gx-8>*+*{margin-left:8px}.gy-10>*+*{margin-top:10px}.gy-12>*+*{margin-top:12px}.gy-16>*+*{margin-top:16px}.gy-22>*+*{margin-top:22px}.gy-26>*+*{margin-top:26px}.gy-30>*+*{margin-top:30px}.gy-4>*+*{margin-top:4px}.gy-6>*+*{margin-top:6px}.gy-7>*+*{margin-top:7px}
button{font-family:inherit;cursor:pointer}
*:focus{outline:none}
button::-moz-focus-inner{border:0}
button:active,a:active{filter:brightness(1.3)}
.s6-range{-webkit-appearance:none;appearance:none;display:block;height:56px;background:transparent;margin:0}
.s6-range::-webkit-slider-runnable-track{height:8px;background:transparent}
.s6-range::-webkit-slider-thumb{-webkit-appearance:none;width:56px;height:56px;margin-top:-24px;border-radius:50%;background:#F2F2F2;border:0;box-shadow:0 0 0 6px rgba(242,242,242,0.18),0 4px 12px rgba(0,0,0,0.6)}
.s6-range::-moz-range-track{height:8px;background:transparent}
.s6-range::-moz-range-thumb{width:56px;height:56px;border-radius:50%;background:#F2F2F2;border:0;box-shadow:0 0 0 6px rgba(242,242,242,0.18),0 4px 12px rgba(0,0,0,0.6)}
.s6-cool::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(47,179,255,0.45),0 4px 12px rgba(0,0,0,0.6)}
.s6-warm::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(212,42,58,0.45),0 4px 12px rgba(0,0,0,0.6)}
.s6-cool::-moz-range-thumb{box-shadow:0 0 0 6px rgba(47,179,255,0.45)}
.s6-warm::-moz-range-thumb{box-shadow:0 0 0 6px rgba(212,42,58,0.45)}
.s6-spin{transform-box:fill-box;transform-origin:50% 50%;-webkit-animation:s6spin 1.6s linear infinite;animation:s6spin 1.6s linear infinite}
.s6-spin.s6-slow{-webkit-animation-duration:3s;animation-duration:3s}
.s6-spin.s6-fast{-webkit-animation-duration:.8s;animation-duration:.8s}
@-webkit-keyframes s6spin{to{-webkit-transform:rotate(360deg)}}
@keyframes s6spin{to{transform:rotate(360deg)}}
.s6-heat{-webkit-animation:s6wave 1.4s ease-in-out infinite;animation:s6wave 1.4s ease-in-out infinite}
.s6-heat.s6-fast{-webkit-animation-duration:.8s;animation-duration:.8s}
.s6-w1{-webkit-animation-delay:.2s;animation-delay:.2s}.s6-w2{-webkit-animation-delay:.4s;animation-delay:.4s}
@-webkit-keyframes s6wave{0%,100%{-webkit-transform:translateY(0);opacity:1}50%{-webkit-transform:translateY(-90px);opacity:.45}}
@keyframes s6wave{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-90px);opacity:.45}}
.s6-wbar{transform-origin:0 50%;-webkit-animation:s6w 3.2s linear forwards;animation:s6w 3.2s linear forwards}@-webkit-keyframes s6w{from{-webkit-transform:scaleX(0)}to{-webkit-transform:scaleX(1)}}@keyframes s6w{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.s6-sheet{-webkit-animation:s6up .18s ease-out;animation:s6up .18s ease-out}
@-webkit-keyframes s6up{from{-webkit-transform:translateY(24px);opacity:0}to{-webkit-transform:none;opacity:1}}
@keyframes s6up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
</style>

<body>
<div id="fit"><div id="stage"></div></div>
<script>
// The design is 1600x900 (full screen: the app hides BYD's header and bottom bar). Scale it to fit the window.
(function () {
  var fit = document.getElementById('fit');
  function size() {
    // Fill the height; the layout stretches sideways to the screen's full width.
    var w = window.innerWidth, h = window.innerHeight;
    if (h > w) {
      // Portrait: 900 wide, stretched to the screen's full height.
      var kp = w / 900;
      fit.className = 'portrait';
      fit.style.width = '900px';
      fit.style.height = Math.max(1600, h / kp) + 'px';
      fit.style.transform = 'scale(' + kp + ')';
      return;
    }
    fit.className = '';
    fit.style.height = '900px';
    var k = h / 900, lw = w / k;
    if (lw < 1600) { k = w / 1600; lw = 1600; }
    fit.style.width = lw + 'px';
    fit.style.transform = 'translate(0px,' + Math.round((h - 900 * k) / 2) + 'px) scale(' + k + ')';
  }
  window.addEventListener('resize', size);
  // Old WebView scrolls a focused control into view, which shoved the tiles up. Pin the page.
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });
  document.addEventListener('focusin', function (e) { if (e.target && e.target.type !== 'range' && e.target.blur) e.target.blur(); window.scrollTo(0, 0); });
  size();
})();
</script>
