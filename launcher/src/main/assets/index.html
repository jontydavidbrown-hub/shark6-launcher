<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shark 6</title>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:600;src:url(fonts/barlow-condensed-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
html,body{margin:0;height:100%;position:fixed;width:100%;top:0;left:0;background:#050505;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#fit{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
#stage{width:100%;height:100%}
a{color:#D42A3A}
/* Flex gaps as margins: the car's WebView predates flexbox gap. */
.gx-10>*+*{margin-left:10px}.gx-14>*+*{margin-left:14px}.gx-18>*+*{margin-left:18px}.gx-20>*+*{margin-left:20px}.gx-22>*+*{margin-left:22px}.gx-24>*+*{margin-left:24px}.gx-28>*+*{margin-left:28px}.gx-4>*+*{margin-left:4px}.gx-6>*+*{margin-left:6px}.gx-8>*+*{margin-left:8px}.gy-10>*+*{margin-top:10px}.gy-12>*+*{margin-top:12px}.gy-16>*+*{margin-top:16px}.gy-22>*+*{margin-top:22px}.gy-26>*+*{margin-top:26px}.gy-30>*+*{margin-top:30px}.gy-4>*+*{margin-top:4px}.gy-6>*+*{margin-top:6px}.gy-7>*+*{margin-top:7px}
button{font-family:inherit;cursor:pointer}
*:focus{outline:none}
button::-moz-focus-inner{border:0}
button:active,a:active{filter:brightness(1.3)}
.s6-range{-webkit-appearance:none;appearance:none;display:block;height:56px;background:transparent;margin:0}
.s6-range::-webkit-slider-runnable-track{height:8px;background:transparent}
.s6-range::-webkit-slider-thumb{-webkit-appearance:none;width:56px;height:56px;margin-top:-24px;border-radius:50%;background:#F2F2F2;border:0;box-shadow:0 0 0 6px rgba(242,242,242,0.18),0 4px 12px rgba(0,0,0,0.6)}
.s6-range::-moz-range-track{height:8px;background:transparent}
.s6-range::-moz-range-thumb{width:56px;height:56px;border-radius:50%;background:#F2F2F2;border:0;box-shadow:0 0 0 6px rgba(242,242,242,0.18),0 4px 12px rgba(0,0,0,0.6)}
.s6-cool::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(47,179,255,0.45),0 4px 12px rgba(0,0,0,0.6)}
.s6-warm::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(212,42,58,0.45),0 4px 12px rgba(0,0,0,0.6)}
.s6-cool::-moz-range-thumb{box-shadow:0 0 0 6px rgba(47,179,255,0.45)}
.s6-warm::-moz-range-thumb{box-shadow:0 0 0 6px rgba(212,42,58,0.45)}
.s6-spin{transform-box:fill-box;transform-origin:50% 50%;-webkit-animation:s6spin 1.6s linear infinite;animation:s6spin 1.6s linear infinite}
.s6-spin.s6-slow{-webkit-animation-duration:3s;animation-duration:3s}
.s6-spin.s6-fast{-webkit-animation-duration:.8s;animation-duration:.8s}
@-webkit-keyframes s6spin{to{-webkit-transform:rotate(360deg)}}
@keyframes s6spin{to{transform:rotate(360deg)}}
.s6-heat{-webkit-animation:s6wave 1.4s ease-in-out infinite;animation:s6wave 1.4s ease-in-out infinite}
.s6-heat.s6-fast{-webkit-animation-duration:.8s;animation-duration:.8s}
.s6-w1{-webkit-animation-delay:.2s;animation-delay:.2s}.s6-w2{-webkit-animation-delay:.4s;animation-delay:.4s}
@-webkit-keyframes s6wave{0%,100%{-webkit-transform:translateY(0);opacity:1}50%{-webkit-transform:translateY(-90px);opacity:.45}}
@keyframes s6wave{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-90px);opacity:.45}}
.s6-wbar{transform-origin:0 50%;-webkit-animation:s6w 3.2s linear forwards;animation:s6w 3.2s linear forwards}@-webkit-keyframes s6w{from{-webkit-transform:scaleX(0)}to{-webkit-transform:scaleX(1)}}@keyframes s6w{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.s6-sheet{-webkit-animation:s6up .18s ease-out;animation:s6up .18s ease-out}
@-webkit-keyframes s6up{from{-webkit-transform:translateY(24px);opacity:0}to{-webkit-transform:none;opacity:1}}
@keyframes s6up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<script>
// The design is 1600x900 (full screen: the app hides BYD's header and bottom bar). Scale it to fit the window.
(function () {
  var fit = document.getElementById('fit');
  function size() {
    // Fill the height; the layout stretches sideways to the screen's full width.
    var w = window.innerWidth, h = window.innerHeight;
    var k = h / 900, lw = w / k;
    if (lw < 1600) { k = w / 1600; lw = 1600; }
    fit.style.width = lw + 'px';
    fit.style.transform = 'translate(0px,' + Math.round((h - 900 * k) / 2) + 'px) scale(' + k + ')';
  }
  window.addEventListener('resize', size);
  // Old WebView scrolls a focused control into view, which shoved the tiles up. Pin the page.
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });
  document.addEventListener('focusin', function (e) { if (e.target && e.target.type !== 'range' && e.target.blur) e.target.blur(); window.scrollTo(0, 0); });
  size();
})();
</script>
<script src="htm-preact.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
