plugins { id 'com.android.application' }

android {
    namespace 'au.jonty.shark6.probe'
    compileSdk 34
    defaultConfig {
        applicationId 'au.jonty.shark6.probe'
        // BYD DiLink runs Android 10 (API 29); sideloaded apps must target <= 33.
        minSdk 29
        targetSdk 29
        versionCode 3
        versionName '0.3'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
