plugins { id 'com.android.application' }

android {
    namespace 'au.jonty.shark6.probe'
    compileSdk 34
    defaultConfig {
        applicationId 'au.jonty.shark6.probe'
        // Shark 6 runs Android 11 (API 30); targeting 29 keeps package visibility open.
        minSdk 29
        targetSdk 29
        versionCode 5
        versionName '0.5'
        ndk { abiFilters 'arm64-v8a' }
    }
    // Fixed debug key, committed on purpose, so every CI build can update the installed app.
    signingConfigs {
        debug {
            storeFile rootProject.file('keys/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
